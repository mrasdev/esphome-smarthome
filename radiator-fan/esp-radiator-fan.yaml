substitutions:
  min_out: 10.0
  max_out: 98.0  # pwm is stuck near 100%

esphome:
  name: esp-radiator-fan
  friendly_name: ESP Kitchen Radiator Fan
  on_boot:
    then:
      - lambda: id(tempmin).publish_state(id(flash_tempmin));
      - lambda: id(tempmax).publish_state(id(flash_tempmax));

preferences:
  flash_write_interval: 5min
  
globals:
  - id: flash_tempmin
    type: float
    restore_value: yes
  - id: flash_tempmax
    type: float
    restore_value: yes

esp32:
  board: esp32dev
  framework:
    type: esp-idf

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_encryption_key_radiator_fan

ota:
  - platform: esphome
    password: !secret ota_password_radiator_fan

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Esp-Radiator-Fan Fallback Hotspot"
    password: !secret ap_password_radiator_fan

captive_portal:
    
web_server:
  port: 80
  version: 3
  local: true
  
light:
  - platform: status_led
    name: "Status LED"
    id: statusled
    internal: true
    pin: 
      number: GPIO04
      inverted: false

sensor:
  - platform: wifi_signal
    name: "WiFi Signal dB"
    id: wifi_signal_db
    update_interval: 60s
    entity_category: "diagnostic"
    disabled_by_default: true
  - platform: copy 
    source_id: wifi_signal_db
    name: "WiFi Signal"
    filters:
      - lambda: return min(max(2 * (x + 100.0), 0.0), 100.0);
    unit_of_measurement: " %"
    entity_category: "diagnostic"
    disabled_by_default: true
  - platform: dallas_temp
    id: tempreal
    name: "Flow Temperature"
    update_interval: 60s
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    icon: "mdi:radiator"
    accuracy_decimals: 1
    on_value: 
      - component.update: fanpower
  - platform: template
    id: fanpower
    name: "Fan Speed"
    unit_of_measurement: "%"
    state_class: measurement
    icon: "mdi:fan"
    accuracy_decimals: 0
    lambda: |-
      if (id(mode_auto).state == false) {
        return id(manualpwr).state;
      }
      if (id(mode_turbo).state == true) {
        return $max_out;
      }
      if (isnan(id(tempreal).raw_state)) {
        return id(fanpower).state;
      }
      if (id(tempreal).state < id(tempmin).state) {
        return 0.0;
      }
      if (id(tempreal).state > id(tempmax).state) {
        return $max_out;
      }
      return (id(tempreal).state-id(tempmin).state) / (id(tempmax).state-id(tempmin).state) * ($max_out-$min_out) + $min_out;
    on_value:
      - output.turn_on: fanpwm
      - output.set_level: 
          id: fanpwm
          level: !lambda return x/100.0;
      - if:
          condition:
            lambda: 'return (id(fanpower).state >= $max_out) or isnan(id(tempreal).raw_state);'
          then:
            - light.turn_on: statusled
          else:
            - light.turn_off: statusled

number:
  - platform: template
    id: tempmin
    name: "Min Temp."
    min_value: 20
    max_value: 40
    step: 1
    optimistic: True
    unit_of_measurement: "°C"
    icon: "mdi:thermometer-chevron-down"
    device_class: temperature
    on_value: 
      - globals.set: 
          id: flash_tempmin
          value: !lambda 'return x;' 
      - component.update: fanpower
  - platform: template
    id: tempmax
    name: "Max Temp."
    min_value: 41
    max_value: 60
    step: 1
    optimistic: True
    unit_of_measurement: "°C"
    icon: "mdi:thermometer-chevron-up"
    device_class: temperature
    on_value:
      - globals.set: 
          id: flash_tempmax
          value: !lambda 'return x;' 
      - component.update: fanpower
  - platform: template
    id: manualpwr
    name: "Manual"
    min_value: 0
    max_value: $max_out
    step: 1
    optimistic: True
    unit_of_measurement: "%"
    icon: "mdi:wrench-cog-outline"
    on_value: 
      - component.update: fanpower

one_wire:
  - platform: gpio
    pin: GPIO16

button:
  - platform: restart
    name: "Restart"
    id: btn_restart
    icon: "mdi:restart"
  - platform: template
    name: "Heartbeat"
    id: btn_heartbeat
    icon: "mdi:alarm-light"
    on_press: 
      then:
        - light.toggle: statusled
        - delay: 100ms
        - light.toggle: statusled   

switch:
  - platform: template
    id: mode_auto
    name: "Auto"
    optimistic: True
    restore_mode: RESTORE_DEFAULT_ON
    icon: "mdi:swap-vertical-bold"
    on_state: 
      - component.update: fanpower
  - platform: template
    id: mode_turbo
    name: "Turbo"
    optimistic: True
    icon: "mdi:car-turbocharger"
    on_state: 
      - component.update: fanpower

output:
  - platform: ledc
    pin: GPIO17
    id: fanpwm
    frequency: 25000
