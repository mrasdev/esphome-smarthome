esphome:
  name: esp-water-meter
  friendly_name: ESP Water Meter
  on_boot:
    then:
      - pulse_meter.set_total_pulses:
          id: water_meter
          value: !lambda 'return id(flash_total_pulses);'

packages:
  common: !include ../common.yaml

preferences:
  flash_write_interval: 5min
  
globals:
  - id: flash_total_pulses
    type: int
    restore_value: yes

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_encryption_key_water_meter
  actions:
    - action: set_total
      variables:
        new_total: int
      then:
        - pulse_meter.set_total_pulses:
            id: water_meter
            value: !lambda 'return new_total;'

ota:
  - platform: esphome
    password: !secret ota_password_water_meter

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Esp-Water-Meter Fallback Hotspot"
    password: !secret ap_password_water_meter

sensor:
  - platform: pulse_meter
    pin:
      number: GPIO21
      mode:
        input: true
        pullup: true
    name: "Flow Rate"
    id: water_meter
    unit_of_measurement: 'l/min'
    device_class: water
    internal_filter_mode: PULSE
    internal_filter: 10ms 
    accuracy_decimals: 1
    timeout: 60s
    filters:
      - multiply: 1   # 1 impulse per liter
      - debounce: 100ms
    on_value:
      then:
        - light.turn_on: statusled
        - delay: 1000ms
        - light.turn_off: statusled  
    total:
      name: "Consumption"
      unit_of_measurement: 'm³'
      device_class: water
      accuracy_decimals: 3
      filters:
        - lambda: |-
            id(flash_total_pulses) = x;
            return x;
        - multiply: 0.001
