esphome:
  name: esp-water-meter
  friendly_name: ESP Water Meter
  on_boot:
    then:
      - pulse_meter.set_total_pulses:
          id: water_meter
          value: !lambda 'return id(flash_total_pulses);'

preferences:
  flash_write_interval: 5min
  
globals:
  - id: flash_total_pulses
    type: int
    restore_value: yes

esp32:
  board: esp32dev
  framework:
    type: esp-idf

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_encryption_key_water_meter
  actions:
    - action: set_total
      variables:
        new_total: int
      then:
        - pulse_meter.set_total_pulses:
            id: water_meter
            value: !lambda 'return new_total;'

ota:
  - platform: esphome
    password: !secret ota_password_water_meter

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Esp-Water-Meter Fallback Hotspot"
    password: !secret ap_password_water_meter

captive_portal:

web_server:
  port: 80
  version: 3
  local: true

light:
  - platform: status_led
    name: "Status LED"
    id: statusled
    internal: true
    pin: 
      number: GPIO04
      inverted: false

sensor:
  - platform: wifi_signal
    name: "WiFi Signal dB"
    id: wifi_signal_db
    update_interval: 60s
    entity_category: "diagnostic"
    disabled_by_default: true
  - platform: copy 
    source_id: wifi_signal_db
    name: "WiFi Signal"
    filters:
      - lambda: return min(max(2 * (x + 100.0), 0.0), 100.0);
    unit_of_measurement: " %"
    entity_category: "diagnostic"
    disabled_by_default: true
  - platform: pulse_meter
    pin:
      number: GPIO21
      mode:
        input: true
        pullup: true
    name: "Flow Rate"
    id: water_meter
    unit_of_measurement: 'l/min'
    device_class: water
    internal_filter_mode: PULSE
    internal_filter: 10ms 
    accuracy_decimals: 1
    timeout: 60s
    filters:
      - multiply: 1   # 1 impulse per liter
      - debounce: 100ms
    on_value:
      then:
        - light.turn_on: statusled
        - delay: 1000ms
        - light.turn_off: statusled  
    total:
      name: "Consumption"
      unit_of_measurement: 'm³'
      device_class: water
      accuracy_decimals: 3
      filters:
        - lambda: |-
            id(flash_total_pulses) = x;
            return x;
        - multiply: 0.001

button:
  - platform: restart
    name: "Restart"
    id: btn_restart
    icon: "mdi:restart"
  - platform: template
    name: "Heartbeat"
    id: btn_heartbeat
    icon: "mdi:alarm-light"
    on_press: 
      then:
        - light.toggle: statusled
        - delay: 100ms
        - light.toggle: statusled   
